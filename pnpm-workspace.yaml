allowBuilds:
  # Vite relies on esbuild for the local frontend build. Wrangler relies on
  # workerd for its local Worker validation. Keep this approval narrow; adding
  # a package here requires a separate supply-chain review.
  esbuild: true
  # OCR ships prebuilt browser assets; its optional funding-message hook is unnecessary.
  tesseract.js: false
  workerd: true

# Keep Wrangler's local Miniflare image-processing dependency on the patched
# release identified by the security audit. This affects local dev/test tooling,
# not the application runtime.
overrides:
  sharp: 0.35.4
