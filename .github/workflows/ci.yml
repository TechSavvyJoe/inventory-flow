name: Validate Inventory Flow

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Covers the cross-browser projects the per-push e2e job skips (see below).
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'What a manual run does'
        type: choice
        default: cross-browser
        options:
          - cross-browser
          - update-visual-baselines

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Reject unsafe repository artifacts
        # Runs before any dependency install (pip or pnpm).
        run: node scripts/check-repo-safety.mjs

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: python -m pip install Pillow pypdf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce the design-system ratchet
        # `pnpm check` runs this locally; CI must too, or a PR can regress the
        # sub-12px and raw-color counts without anything failing.
        run: pnpm check:design-system

      - name: Run unit and component tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Validate cloud release and recovery contracts
        run: |
          pnpm cloud:validate
          node scripts/run-recovery-drill.mjs
          python -m unittest discover -s tests/python

  e2e:
    # Keep the required check stable, and report a failure if either independent
    # suite fails, is cancelled, or is skipped after an unsuccessful build.
    if: always() && github.event_name != 'schedule'
    needs: [test-and-build, e2e-browser, e2e-cross-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both browser suites to succeed
        env:
          BUILD_RESULT: ${{ needs.test-and-build.result }}
          BROWSER_RESULT: ${{ needs.e2e-browser.result }}
          CROSS_BROWSER_RESULT: ${{ needs.e2e-cross-browser.result }}
        run: |
          if [ "$BUILD_RESULT" != 'success' ] || [ "$BROWSER_RESULT" != 'success' ] || [ "$CROSS_BROWSER_RESULT" != 'success' ]; then
            printf 'Required results: build=%s browser=%s cross-browser=%s\n' "$BUILD_RESULT" "$BROWSER_RESULT" "$CROSS_BROWSER_RESULT"
            exit 1
          fi

  e2e-browser:
    if: github.event_name != 'schedule'
    needs: test-and-build
    runs-on: ubuntu-latest
    # This suite covers ordinary Chromium desktop and WebKit mobile tests.
    # Cross-browser acceptance runs independently in e2e-cross-browser. Firefox, the
    # Chromium-Android emulation, and the WebKit-desktop project run once a
    # night in cross-browser-nightly below, not on every push. The pinned image
    # includes both engines and their OS dependencies, avoiding repeated slow
    # Ubuntu mirror installs while preserving both suites and their limits.
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Trust the workspace inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify bundled browser engines
        run: |
          pnpm exec node --input-type=module <<'NODE'
          import { accessSync } from 'node:fs'
          import { createRequire } from 'node:module'
          import { chromium, webkit } from '@playwright/test'
          const require = createRequire(import.meta.url)
          if (require('@playwright/test/package.json').version !== '1.62.1') throw new Error('PLAYWRIGHT_IMAGE_VERSION_MISMATCH')
          for (const browser of [chromium, webkit]) accessSync(browser.executablePath())
          console.log('Pinned Chromium and WebKit engines present')
          NODE

      - name: Run browser end-to-end tests
        # Playwright starts dedicated synthetic servers on 4473/4474;
        # acceptance uses its own fresh 4273/4274 ledger.
        env:
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
        run: pnpm test:e2e --project=desktop --project=mobile

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-browser
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-cross-browser:
    if: github.event_name != 'schedule'
    needs: test-and-build
    runs-on: ubuntu-latest
    # This suite covers chromium-desktop/webkit-mobile acceptance projects.
    # Ordinary browser tests run independently in e2e-browser. Firefox, the
    # Chromium-Android emulation, and the WebKit-desktop project run once a
    # night in cross-browser-nightly below, not on every push. The pinned image
    # includes both engines and their OS dependencies, avoiding repeated slow
    # Ubuntu mirror installs while preserving both suites and their limits.
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Trust the workspace inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify bundled browser engines
        run: |
          pnpm exec node --input-type=module <<'NODE'
          import { accessSync } from 'node:fs'
          import { createRequire } from 'node:module'
          import { chromium, webkit } from '@playwright/test'
          const require = createRequire(import.meta.url)
          if (require('@playwright/test/package.json').version !== '1.62.1') throw new Error('PLAYWRIGHT_IMAGE_VERSION_MISMATCH')
          for (const browser of [chromium, webkit]) accessSync(browser.executablePath())
          console.log('Pinned Chromium and WebKit engines present')
          NODE

      - name: Run cross-browser acceptance (Chromium + WebKit only)
        env:
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
        run: pnpm exec playwright test --config playwright.cross-browser.config.ts --project=chromium-desktop --project=webkit-mobile

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cross-browser
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    # Pinned visual-regression gate (see playwright.visual.config.ts). Baselines
    # are meaningful only on this exact container image + Chromium build, so
    # this job — never the Mac, which has branded Chrome and no Docker — is the
    # only place a baseline comparison is trusted. Runs on pull_request and
    # push to main like the rest of the suite; not on the nightly schedule
    # (cross-browser-nightly's job) or a manual dispatch (that always means
    # update-visual-baselines or cross-browser below, never a comparison run).
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Select temporary baseline directory
        run: echo "INVENTORY_VISUAL_BASELINE_DIR=$RUNNER_TEMP/inventory-flow-visual-baselines" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@v4
      - name: Trust the workspace inside the container
        # Container steps run as root; the runner-created workspace is owned by the runner uid, and `pnpm build` runs `git ls-files` (scripts/package-extension.mjs).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore reviewed visual baselines
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/visual-baselines.mjs restore

      - name: Build production bundle
        # The gate pins the actual `pnpm build` CSS cascade, not the dev server's.
        run: pnpm build

      - name: Run the visual-regression gate
        env:
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
        run: pnpm exec playwright test --config playwright.visual.config.ts --update-snapshots=none

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/visual/
          retention-days: 7

  update-visual-baselines:
    # The only re-baseline path. Manually triggered (Actions tab -> this
    # workflow -> Run workflow) after a deliberate, reviewed visual change;
    # never runs on a schedule or a push, so it never silently repins a
    # regression. Review the external candidate, publish its exact bundle as a
    # private CI baseline release asset, and update the metadata-only pin.
    # No PNGs enter Git. This job never publishes or changes the pin itself;
    # the whole workflow keeps `permissions: contents: read`.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'update-visual-baselines'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Select temporary baseline directory
        run: echo "INVENTORY_VISUAL_BASELINE_DIR=$RUNNER_TEMP/inventory-flow-visual-baselines" >> "$GITHUB_ENV"
      - name: Check out source
        uses: actions/checkout@v4
      - name: Trust the workspace inside the container
        # Container steps run as root; the runner-created workspace is owned by the runner uid, and `pnpm build` runs `git ls-files` (scripts/package-extension.mjs).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build

      - name: Regenerate visual baselines
        env:
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
        run: pnpm exec playwright test --config playwright.visual.config.ts --update-snapshots=all

      - name: Package candidate with source provenance and hashes
        run: |
          node scripts/visual-baselines.mjs pack --dir "$INVENTORY_VISUAL_BASELINE_DIR" --out "$INVENTORY_VISUAL_BASELINE_DIR/visual-baselines.json"
          test -s "$INVENTORY_VISUAL_BASELINE_DIR/visual-baselines.json"

      - name: Upload regenerated snapshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-candidate
          path: ${{ runner.temp }}/inventory-flow-visual-baselines/
          if-no-files-found: error
          retention-days: 14

  cross-browser-nightly:
    # The engines and projects per-push e2e above does not cover: Chromium
    # Android emulation, WebKit desktop, and Firefox desktop. Runs once a
    # night (or on demand) instead of on every push.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.target == 'cross-browser')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-webkit-firefox-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit firefox

      - name: Run remaining cross-browser acceptance projects
        env:
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
        run: pnpm exec playwright test --config playwright.cross-browser.config.ts --project=chromium-android --project=webkit-desktop --project=firefox-desktop

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly
          path: |
            playwright-report/
            test-results/
          retention-days: 7
