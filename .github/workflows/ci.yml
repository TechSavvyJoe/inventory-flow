name: Validate Inventory Flow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Reject unsafe repository artifacts
        run: node scripts/check-repo-safety.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce the design-system ratchet
        # `pnpm check` runs this locally; CI must too, or a PR can regress the
        # sub-12px and raw-color counts without anything failing.
        run: pnpm check:design-system

      - name: Run unit and component tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Chromium browser
        # Only Chromium: both Playwright projects are Chromium-engine, and the
        # bundled build is version-pinned so a Google Chrome release cannot break
        # CI on its own. PLAYWRIGHT_BUNDLED_CHROMIUM below drops the local
        # `chrome` channel to match.
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        # playwright.config.ts starts `pnpm dev:demo` itself and waits for
        # 127.0.0.1:4173, so the synthetic demo servers need no separate step.
        env:
          PLAYWRIGHT_BUNDLED_CHROMIUM: '1'
        run: pnpm test:e2e --project=desktop --project=mobile

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
